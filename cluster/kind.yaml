# Single control-plane node. Host ports match HOST_HTTP_PORT and HOST_HTTPS_PORT
# in versions.env. containerPort values match NODE_HTTP_PORT and NODE_HTTPS_PORT.
# 8080 and 8443 are left alone because another kind cluster already publishes them.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 31080
        hostPort: 18080
        protocol: TCP
      - containerPort: 31443
        hostPort: 18443
        protocol: TCP
